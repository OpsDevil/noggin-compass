[project]
name = "noggin-compass"
version = "0.1.0"
description = "Tracks how long a sleeping baby's head is turned left, right or straight"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "transformers>=4.56",
]

[project.scripts]
noggin-compass = "noggin_compass.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noggin_compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
